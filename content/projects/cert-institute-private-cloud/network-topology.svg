<text x="14" y="562" font-size="9.5" fill="#94a3b8">※ 실제 구축 대역은 표기 규칙만 반영한 예시 표기입니다. Provider·서비스 망은 업무 / 컨테이너 / 모니터링 / DMZ 4개 VLAN으로 분리.</text>
<text x="14" y="580" font-size="9.5" fill="#94a3b8">※ IPMI·백업 망은 서비스 경로와 물리적으로 분리, SAN은 이더넷을 경유하지 않는 FC 전용 경로.</text>
